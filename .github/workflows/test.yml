name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Keep Linux on 3.11-3.13; run Windows on 3.11 and 3.13.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cross-platform (no bash-only constructs): runs identically on the
      # Windows and Linux runners.
      - name: Run test suite (ResourceWarning as error)
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py" -v

      # Verify every console entry point resolves from an installed package
      # (incl. exi-hook, which generated hook commands depend on) — Windows too.
      - name: Install package and verify entry points
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          exi --help
          codex-guard --help
          exi-hook install claude --scope project --project . --dry-run

      # Distribution artifacts only need building once, on Linux.
      - name: Build sdist + wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade build
          python -m build
