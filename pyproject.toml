[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Distribution name kept as codex-feedback-guard for backward compatibility
# with existing installs (`pip install codex-feedback-guard`); the project's
# public/display name is "Agent Steward".
[project]
name = "codex-feedback-guard"
version = "0.1.0"
description = "Provider-neutral local memory, feedback, continuity, and safety tools for AI coding agents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Torrant5" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Torrant5/agent-steward"
Issues = "https://github.com/Torrant5/agent-steward/issues"

[project.scripts]
exi = "exi.exicli:main"
codex-guard = "exi.guardcli:main"
exi-hook = "exi.hookcli:main"

[tool.setuptools]
packages = ["exi"]

[tool.setuptools.package-data]
exi = ["config.default.json"]
